services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # ICU root collation: linguistic ordering and Unicode (Cyrillic) case folding for
      # full-text search. Only applied when the volume is first initialized.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=und"
    # No published port: only the API reaches the database, over the backend network.
    volumes:
      # postgres 18+ keeps its data under /var/lib/postgresql/<major>/docker.
      - pg_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: server/BookHub/Dockerfile.prod
    container_name: server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # The app connects as POSTGRES_USER for now; a least-privilege role is Phase 3 (S-09).
      # Production doesn't apply migrations yet (D-04, Phase 3).
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtSettings__Secret=${APP_SECRET}
      - JwtSettings__Issuer=${ISSUER}
      - JwtSettings__Audience=${AUDIENCE}
      - EmailSettings__Host=${SMTP_HOST}
      - EmailSettings__Port=${SMTP_PORT}
      - EmailSettings__UserName=${SMTP_USER}
      - EmailSettings__Password=${SMTP_PASSWORD}
      - EmailSettings__From=${SMTP_FROM}
      - EmailSettings__UseSsl=${SMTP_USE_SSL}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
      - AppUrlsSettings__ClientBaseUrl=${CLIENT_BASE_URL}
      - BootstrapAdmin__Enabled=${BOOTSTRAP_ADMIN_ENABLED:-false}
      - BootstrapAdmin__Email=${BOOTSTRAP_ADMIN_EMAIL}
      - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD}
      - BootstrapAdmin__Role=${BOOTSTRAP_ADMIN_ROLE:-Administrator}
    volumes:
      - server_uploads:/app/wwwroot
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_REACT_APP_SERVER_URL: "http://server:8080"
    container_name: client
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pg_data:
  server_uploads:
