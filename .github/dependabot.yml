# Dependabot PRs must NOT be merged until the Phase 2 CI gate (D-05 in
# docs/review/2026-10-code-review.md) runs tests on pull requests. Until then,
# CI only builds on pushes to develop/master, so nothing checks these PRs.
#
# Minor and patch updates are grouped into one PR per ecosystem; major updates
# open as separate PRs.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # sqlserver/ is left out on purpose: SQL Server is replaced by PostgreSQL in Phase 1.5.
  - package-ecosystem: docker
    directories:
      - /client
      - /server/BookHub
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
