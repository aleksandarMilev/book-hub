# Dependabot PRs may be merged once both CI checks ("server" and "client" in
# .github/workflows/ci.yml) are green. CI builds and tests the server and lints,
# typechecks, tests and builds the client on every pull request (D-05 in
# docs/review/2026-10-code-review.md). CI doesn't build the Docker images yet
# (Phase 3), so docker and docker-compose PRs need a local `docker compose build`.
#
# Minor and patch updates are grouped into one PR per ecosystem; major updates
# open as separate PRs.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /client
      - /server/BookHub
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # The postgres image is referenced directly in the Compose files. Keep the test
  # container (server/BookHub.Tests/Shared/Database/PostgresServer.cs) on the same major.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
